name: Check Windows preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python dependencies and tests
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Build native programs
        shell: powershell
        run: .\Install.ps1 -BuildOnly -NoShortcuts
      - name: Check renderer script and source archive
        shell: pwsh
        run: |
          node --check app/skin-runtime.cjs
          python tools/package.py --output dist/Fairy-Companion-source.zip
          python tools/package.py --binaries --output dist/Fairy-Companion-windows-x64.zip
